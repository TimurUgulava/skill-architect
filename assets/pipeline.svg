<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="580" viewBox="0 0 1540 580" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
<marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#3a3a3a"/></marker>
<marker id="arrO" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#FE9901"/></marker>
</defs>
<rect width="1540" height="580" fill="#ffffff"/>
<rect x="40" y="200" width="170" height="90" rx="12" fill="#f3f3f3" stroke="#3a3a3a" stroke-width="2"/>
<text x="125" y="238" text-anchor="middle" font-size="22" font-weight="600" fill="#1a1a1a">Запрос</text>
<text x="125" y="266" text-anchor="middle" font-size="15" fill="#555">«сделай скилл…»</text>
<polygon points="345,160 470,245 345,330 220,245" fill="#fff4e0" stroke="#FE9901" stroke-width="3"/>
<text x="345" y="232" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">Шаг 0</text>
<text x="345" y="256" text-anchor="middle" font-size="16" fill="#1a1a1a">нужен ли</text>
<text x="345" y="276" text-anchor="middle" font-size="16" fill="#1a1a1a">скилл?</text>
<line x1="210" y1="245" x2="218" y2="245" stroke="#3a3a3a" stroke-width="2.5" marker-end="url(#arr)"/>
<line x1="345" y1="330" x2="325" y2="418" stroke="#3a3a3a" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="322" y="380" text-anchor="end" font-size="15" fill="#555">модель справится сама</text>
<rect x="160" y="420" width="310" height="90" rx="12" fill="#f3f3f3" stroke="#3a3a3a" stroke-width="2"/>
<text x="315" y="456" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a">Скилл не нужен</text>
<text x="315" y="482" text-anchor="middle" font-size="13.5" fill="#555">строка в CLAUDE.md, скрипт или ничего</text>
<line x1="470" y1="245" x2="518" y2="245" stroke="#3a3a3a" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="495" y="228" text-anchor="middle" font-size="15" fill="#555">да</text>
<rect x="520" y="185" width="176" height="120" rx="12" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
<text x="608" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#FE9901">ШАГ 1</text>
<text x="608" y="238" text-anchor="middle" font-size="19" font-weight="600" fill="#1a1a1a">Разобраться</text>
<text x="608" y="264" text-anchor="middle" font-size="15" fill="#555">вопросы только</text>
<text x="608" y="284" text-anchor="middle" font-size="15" fill="#555">по развилкам</text>
<line x1="696" y1="245" x2="722" y2="245" stroke="#3a3a3a" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="724" y="185" width="176" height="120" rx="12" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
<text x="812" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#FE9901">ШАГ 2</text>
<text x="812" y="238" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">Спроектировать</text>
<text x="812" y="264" text-anchor="middle" font-size="15" fill="#555">результат, свобода,</text>
<text x="812" y="284" text-anchor="middle" font-size="15" fill="#555">дерево, защита</text>
<line x1="900" y1="245" x2="926" y2="245" stroke="#3a3a3a" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="928" y="185" width="176" height="120" rx="12" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
<text x="1016" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#FE9901">ШАГ 3</text>
<text x="1016" y="238" text-anchor="middle" font-size="19" font-weight="600" fill="#1a1a1a">Собрать</text>
<text x="1016" y="264" text-anchor="middle" font-size="15" fill="#555">маршрутизатор,</text>
<text x="1016" y="284" text-anchor="middle" font-size="15" fill="#555">ветви, скрипты</text>
<line x1="1104" y1="245" x2="1130" y2="245" stroke="#3a3a3a" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="1132" y="185" width="176" height="120" rx="12" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
<text x="1220" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#FE9901">ШАГ 4</text>
<text x="1220" y="238" text-anchor="middle" font-size="19" font-weight="600" fill="#1a1a1a">Проверить</text>
<text x="1220" y="264" text-anchor="middle" font-size="15" fill="#555">чистый контекст,</text>
<text x="1220" y="284" text-anchor="middle" font-size="15" fill="#555">слепой судья</text>
<line x1="1308" y1="245" x2="1334" y2="245" stroke="#3a3a3a" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="1336" y="185" width="176" height="120" rx="12" fill="#ffffff" stroke="#3a3a3a" stroke-width="2"/>
<text x="1424" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#FE9901">ШАГ 5</text>
<text x="1424" y="238" text-anchor="middle" font-size="19" font-weight="600" fill="#1a1a1a">Отдать</text>
<text x="1424" y="264" text-anchor="middle" font-size="15" fill="#555">что проверено,</text>
<text x="1424" y="284" text-anchor="middle" font-size="15" fill="#555">что нет</text>
<text x="812" y="70" text-anchor="middle" font-size="15" font-weight="600" fill="#FE9901">две точки остановки: здесь скилл ждёт автора</text>
<circle cx="710" cy="140" r="9" fill="#FE9901"/><text x="710" y="120" text-anchor="middle" font-size="14" fill="#1a1a1a">ответы на развилки</text>
<line x1="710" y1="149" x2="710" y2="178" stroke="#FE9901" stroke-width="2" stroke-dasharray="4 4"/>
<circle cx="914" cy="140" r="9" fill="#FE9901"/><text x="914" y="120" text-anchor="middle" font-size="14" fill="#1a1a1a">«архитектура верна?»</text>
<line x1="914" y1="149" x2="914" y2="178" stroke="#FE9901" stroke-width="2" stroke-dasharray="4 4"/>
<path d="M1424,305 L1424,470 L1042,470" fill="none" stroke="#FE9901" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrO)"/>
<rect x="700" y="425" width="340" height="90" rx="12" fill="#fff4e0" stroke="#FE9901" stroke-width="2.5"/>
<text x="870" y="458" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a">Ревизия</text>
<text x="870" y="484" text-anchor="middle" font-size="14" fill="#555">спустя месяцы: правки CHG-N с откатом</text>
<path d="M700,470 L500,470 L500,307" fill="none" stroke="#FE9901" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrO)"/>
</svg>